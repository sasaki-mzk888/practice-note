# --- MySQL (Docker Compose) ---
spring.config.import=optional:file:./.env[.properties],optional:file:./practice-note/backend/.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/${DB_NAME:productform}?serverTimezone=Asia/Tokyo
spring.datasource.username=${DB_USERNAME:puroductuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# テーブルは schema.sql で作るので、Hibernateには作らせない
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- 起動時に schema.sql / data.sql を実行する ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# SQLの初期化をHibernateのテーブル確認後に実行する
spring.jpa.defer-datasource-initialization=true

server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
