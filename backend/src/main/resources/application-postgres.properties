# Neon CLI writes DATABASE_URL to .env.local; production hosts should set the same env var.
spring.config.import=optional:file:./.env.local[.properties],optional:file:../.env.local[.properties],optional:file:./backend/.env.local[.properties]
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.schema-locations=classpath:schema-postgres.sql
spring.sql.init.data-locations=classpath:data-postgres.sql

# Render supplies PORT; local runs of this profile use 8080 by default.
server.port=${PORT:8080}
